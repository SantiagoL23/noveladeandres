<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <meta name="description" content="AnimeUruguay: lee novelas por capítulos a tu ritmo.">
  <title>AnimeUruguay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="topbar glass">
    <a class="brand" href="#inicio" aria-label="AnimeUruguay, inicio">
      <span class="brand-mark" aria-hidden="true">A</span><span>AnimeUruguay</span>
    </a>
    <nav class="top-actions" aria-label="Acciones principales">
      <button class="icon-button" id="openIndex" type="button" aria-label="Abrir índice de capítulos" title="Índice de capítulos">☷</button>
    </nav>
  </header>

  <main id="app">
    <section class="home-chapters page-view" id="inicio" aria-labelledby="homeTitle">
      <div class="home-heading">
        <p class="eyebrow"><span class="eyebrow-dot"></span> BIBLIOTECA</p>
        <h1 id="homeTitle">Capítulos</h1>
      </div>
      <div class="home-chapter-list" id="homeChapterList" aria-label="Capítulos disponibles"></div>
    </section>

    <section class="reader page-view hidden" id="reader" aria-labelledby="readerTitle">
      <div class="reader-toolbar">
        <button class="back-link" id="backHome" type="button">← <span>Capítulos</span></button>
        <button class="tool-button" id="readerIndex" type="button" title="Índice de capítulos" aria-label="Índice de capítulos">☷</button>
      </div>
      <div class="progress-wrap" aria-label="Progreso del capítulo">
        <div class="progress-label"><span id="progressChapter">CAPÍTULO 01</span><span id="progressPercent">0%</span></div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>
      <article class="reading-column" id="readingColumn">
        <header class="chapter-heading">
          <p class="eyebrow">CAPÍTULO <span id="chapterNumber">01</span></p>
          <h2 id="readerTitle">Un despertar de pesadilla</h2>
          <div class="chapter-divider"><span></span> ✦ <span></span></div>
        </header>
        <div class="chapter-content" id="chapterContent" tabindex="-1"></div>
        <nav class="chapter-nav" aria-label="Navegación entre capítulos">
          <button class="chapter-nav-button" id="previousChapter" type="button" disabled><span>←</span><span><small>ANTERIOR</small><strong>Primer capítulo</strong></span></button>
          <button class="chapter-nav-button next" id="nextChapter" type="button" disabled><span><small>SIGUIENTE</small><strong>Próximamente</strong></span><span>→</span></button>
        </nav>
        <p class="end-note">Has llegado al final de este capítulo. Tómate tu tiempo. <span>✦</span></p>
      </article>
    </section>
  </main>

  <div class="reader-control-dock glass" id="readerControlDock" aria-label="Controles de lectura" aria-hidden="true">
    <button class="dock-button" id="fontDown" type="button" title="Disminuir tamaño de letra" aria-label="Disminuir tamaño de letra">A−</button>
    <span class="dock-divider" aria-hidden="true"></span>
    <button class="dock-button" id="fontUp" type="button" title="Aumentar tamaño de letra" aria-label="Aumentar tamaño de letra">A+</button>
    <span class="dock-divider" aria-hidden="true"></span>
    <button class="dock-button" id="widthToggle" type="button" title="Cambiar ancho de lectura" aria-label="Cambiar ancho de lectura">↔</button>
    <span class="dock-divider" aria-hidden="true"></span>
    <button class="dock-button theme-dock-button" id="themeToggle" type="button" aria-label="Activar modo claro" title="Cambiar tema"><span id="themeIcon">☼</span></button>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="chapter-drawer glass" id="chapterDrawer" aria-labelledby="drawerTitle" aria-hidden="true">
    <div class="drawer-head"><div><p class="eyebrow">TU RECORRIDO</p><h2 id="drawerTitle">Índice</h2></div><button class="icon-button" id="closeIndex" type="button" aria-label="Cerrar índice">×</button></div>
    <p class="drawer-subtitle">Elige dónde quieres continuar.</p>
    <div class="drawer-progress"><div class="progress-label"><span>PROGRESO GENERAL</span><span id="overallProgress">0%</span></div><div class="progress-track"><div class="progress-bar" id="overallBar"></div></div></div>
    <div class="chapter-list" id="chapterList"></div>
    <p class="drawer-footnote">Tu posición de lectura se guarda en este dispositivo.</p>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="chapters.js"></script>
  <script src="app.js"></script>
</body>
</html>
